apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.2.0
            env:
              DB_HOSTNAME: postgres.${DOMAIN}
              DB_PORT: "5432"
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-user
                    key: password
              DB_SSL_MODE: require
              DB_VECTOR_EXTENSION: vectorchord

    immich:
      persistence:
        library:
          existingClaim: immich-library
      configurationKind: Secret
      existingConfiguration: immich-configuration

    valkey:
      enabled: true

    server:
      ingress:
        main:
          enabled: true
          className: traefik
          hosts:
            - host: immich.${DOMAIN}
              paths:
                - path: /
                  service:
                    identifier: main
